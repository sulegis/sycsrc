# This is a basic workflow to help you get started with Actions

name: Sync from A Repo

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 需要写权限推送回 B 仓库

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # 1. 检出 B 仓库（当前仓库）
      - name: Checkout B repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 如果用默认 token，push 时需要带上
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. 拉取 A 仓库到临时目录
      - name: Clone A repo
        run: |
          git clone --depth 1 https://github.com/SuperMap/iClient-JavaScript.git /tmp/repo-a

      # 3. 用 rsync 同步，排除指定目录
      - name: Sync with exclusions
        run: |
          rsync -av --delete \
            --exclude=dist/ \
            --exclude=examples/ \
            --exclude=node_modules/ \
            --exclude=.github/ 
            /tmp/repo-a/ ./ 
      
      # 4. 提交并强制推送到 B 仓库
      - name: Commit and force push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: sync from A repo [skip ci]"
            git push origin HEAD:${{ github.ref_name }} --force
          fi          
